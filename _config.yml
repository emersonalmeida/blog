# -------------------------------------
# 🌐 Configurações básicas do site
# -------------------------------------
title: "ea/blog"
description: "Blog pessoal sobre tecnologia, design e cripto."
url: "https://emersonalmeida.github.io"   # domínio principal
baseurl: "/blog"                          # subpasta do projeto (em branco se usar domínio próprio)
lang: pt-BR                               # idioma do site

# -------------------------------------
# 🔗 Estrutura de links
# -------------------------------------
# URLs mais limpas (sem data, sem categoria)
permalink: /:title:output_ext

# -------------------------------------
# 📄 Páginas fixas no cabeçalho
# -------------------------------------
header_pages:
  - sobre.md
  - contato.md
  - categorias.md
  # - tags.md   # (quando você criar a página de tags)

# -------------------------------------
# 🎨 Tema e estilo
# -------------------------------------
theme: minima

# Ativar suporte a SCSS (assets/main.scss já existe)
sass:
  style: compressed   # gera CSS minificado

# -------------------------------------
# 🔍 Plugins suportados pelo GitHub Pages
# -------------------------------------
plugins:
  - jekyll-feed       # gera feed.xml (RSS/Atom)
  - jekyll-sitemap    # gera sitemap.xml
  - jekyll-seo-tag    # SEO, Open Graph, Twitter Cards

# -------------------------------------
# 📢 Redes sociais (suportadas pelo tema minima)
# -------------------------------------
minima:
  social_links:
    github: emersonalmeida
    linkedin: emersonalmeida
    twitter: emersonalmeida
    mastodon: https://mastodon.social/@emersonalmeida

# -------------------------------------
# ⚡ Extras opcionais
# -------------------------------------

# Paginação (caso queira dividir lista de posts em páginas)
paginate: 10
paginate_path: "/page:num/"

# Markdown config
markdown: kramdown
kramdown:
  input: GFM           # suporta GitHub Flavored Markdown
  math_engine: mathjax # ativa fórmulas LaTeX
  syntax_highlighter: rouge

# Google Analytics (quando você tiver o ID)
google_analytics: "UA-XXXXXXX-X"

